<!DOCTYPE html>
<html class="theme-dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<meta name="format-detection" content="telephone=no" />
<meta name="msapplication-tap-highlight" content="no" />
<meta name="msapplication-navbutton-color" content="#0a0a0d" />
<title>MP3Lumia</title>
<style>
/* MP3Lumia — Spotify-style dark and light shells for the Lumia 929 (360x640 CSS
   px) with a desktop sidebar at 900 px and wider. Class-based themes and no CSS
   variables, grid or flex gap: the installed app runs on EdgeHTML. */

* { box-sizing: border-box; }

html, body { height: 100%; margin: 0; padding: 0; }

body {
  font-family: "Segoe UI", "Segoe WP", "Helvetica Neue", Arial, sans-serif;
  font-size: 14px;
  line-height: 1.35;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  -webkit-text-size-adjust: 100%;
  -ms-text-size-adjust: 100%;
  -webkit-tap-highlight-color: rgba(0, 0, 0, 0);
  -webkit-user-select: none;
  user-select: none;
  cursor: default;
}

html.theme-dark body { background: #0a0a0d; color: #f6f6f8; }
html.theme-light body { background: #f5f5f8; color: #101015; }

.hidden, #fileinput, #dirinput, audio { display: none; }

.ico {
  width: 20px; height: 20px; display: block;
  fill: none; stroke: currentColor; stroke-width: 1.8;
  stroke-linecap: round; stroke-linejoin: round;
}
.ico.ico-fill { fill: currentColor; stroke: none; }

/* ---------------------------------------------------------------- boot */

#boot {
  position: fixed; left: 0; right: 0; top: 0; bottom: 0; z-index: 200;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  background: #0a0a0d; color: #fff; transition: opacity .25s ease;
}
body.booted #boot { opacity: 0; pointer-events: none; }
.boot-mark {
  width: 66px; height: 66px; border-radius: 18px; background: #1ed760;
  display: flex; align-items: center; justify-content: center; color: #06130a;
}
.boot-mark .ico { width: 34px; height: 34px; }
.boot-name { margin-top: 15px; letter-spacing: .3em; font-size: 12px; font-weight: 600; opacity: .8; }

#jsfail {
  display: none; position: fixed; left: 0; right: 0; top: 0; bottom: 0; z-index: 210;
  padding: 30px 22px; background: #0a0a0d; color: #f2f2f2;
  font-size: 14px; line-height: 1.5; white-space: pre-wrap;
}

/* ----------------------------------------------------------------- bar */

.topbar {
  flex: 0 0 auto; height: 52px; display: flex; align-items: center;
  padding: 0 6px 0 14px; position: relative; z-index: 30;
}
html.theme-dark .topbar { background: #0a0a0d; border-bottom: 1px solid rgba(255,255,255,.06); }
html.theme-light .topbar { background: #f5f5f8; border-bottom: 1px solid rgba(0,0,0,.07); }

.brand { display: flex; align-items: center; flex: 1 1 auto; min-width: 0; }
.brand-mark {
  width: 28px; height: 28px; border-radius: 8px; background: #1ed760; color: #06130a;
  display: flex; align-items: center; justify-content: center; margin-right: 9px;
}
.brand-mark .ico { width: 17px; height: 17px; }
.brand-name { font-size: 15px; font-weight: 300; letter-spacing: .08em; white-space: nowrap; }
.brand-name b { font-weight: 700; }

.topbar-actions { display: flex; align-items: center; }
.iconbtn {
  width: 38px; height: 38px; border: 0; border-radius: 50%;
  background: transparent; color: inherit; display: flex; align-items: center;
  justify-content: center; padding: 0; cursor: pointer;
}
.iconbtn:active { background: rgba(127,127,127,.18); }
.iconbtn.back { display: none; margin-right: 2px; }
.iconbtn.back.on { display: flex; }

/* ---------------------------------------------------------------- main */

.main {
  flex: 1 1 auto; overflow-y: auto; overflow-x: hidden;
  -webkit-overflow-scrolling: touch; position: relative;
}
.page { padding: 16px 16px 148px; }

.page-head { margin-bottom: 12px; }
.page-head h1 { font-size: 24px; line-height: 1.15; margin: 0 0 3px; letter-spacing: -.02em; font-weight: 700; }
.page-sub, .tr-sub, .card-sub, .lrow-s, .detail-sub, .detail-meta, .set-sub,
.empty-s, .hint, .count, .list-meta, .about, .sheet-sub, .q-s, .np-artist,
.np-foot, .stats, .sheet-foot, .genre-n, .confirm-body, .slider-val, .row-sub {
  color: #a7a7b3;
}
html.theme-light .page-sub, html.theme-light .tr-sub, html.theme-light .card-sub,
html.theme-light .lrow-s, html.theme-light .detail-sub, html.theme-light .detail-meta,
html.theme-light .set-sub, html.theme-light .empty-s, html.theme-light .hint,
html.theme-light .count, html.theme-light .list-meta, html.theme-light .about,
html.theme-light .sheet-sub, html.theme-light .q-s, html.theme-light .np-artist,
html.theme-light .np-foot, html.theme-light .stats, html.theme-light .sheet-foot,
html.theme-light .genre-n, html.theme-light .confirm-body, html.theme-light .slider-val {
  color: #5e5e6b;
}
.page-sub { font-size: 12.5px; }
.row-head { display: flex; align-items: center; justify-content: space-between; }
.row-head > div { flex: 1 1 auto; min-width: 0; }

.section-head {
  display: flex; align-items: baseline; justify-content: space-between;
  margin: 20px 0 8px;
}
.section-head h2 { font-size: 17px; font-weight: 700; margin: 0; letter-spacing: -.01em; }
.txt-btn {
  background: transparent; border: 0; color: #a7a7b3; font: inherit;
  font-size: 11.5px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em;
  padding: 4px 2px; cursor: pointer;
}
html.theme-light .txt-btn { color: #5e5e6b; }
.count { font-size: 12px; }

/* --------------------------------------------------------------- cards */

.hscroll {
  display: flex; overflow-x: auto; overflow-y: hidden;
  margin: 0 -16px; padding: 0 16px 4px; -webkit-overflow-scrolling: touch;
}
.hscroll .card { flex: 0 0 136px; width: 136px; margin-right: 10px; }
.hscroll .card:last-child { margin-right: 0; }

.card {
  background: transparent; border: 0; padding: 0; margin: 0 0 4px;
  color: inherit; font: inherit; text-align: left; cursor: pointer; border-radius: 8px;
}
.card-art {
  width: 100%; height: 0; padding-top: 100%; border-radius: 8px;
  background-size: cover; background-position: center; background-repeat: no-repeat;
  position: relative; background-color: #26262f;
}
.card-art.round { border-radius: 50%; }
.artbox { position: relative; overflow: hidden; }
.artbox .ph {
  position: absolute; top: 0; right: 0; bottom: 0; left: 0;
  display: flex; align-items: center; justify-content: center;
  background: #303039; color: #8b8b98;
}
.artbox .ph .ico { width: 34%; height: 34%; max-width: 54px; max-height: 54px; min-width: 16px; min-height: 16px; }
.artbox.hasart .ph { display: none; }
html.theme-light .artbox .ph { background: #e4e4eb; color: #777783; }
.card-name {
  font-size: 13.5px; font-weight: 600; margin-top: 7px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.card-sub {
  font-size: 11.5px; margin-top: 1px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.card.artist { text-align: center; }
.card.artist .card-name { font-size: 12.5px; }

.grid { display: flex; flex-wrap: wrap; margin: 0 -5px; }
.grid .card { width: 50%; padding: 0 5px; margin-bottom: 14px; }
.grid .card-art { border-radius: 6px; }

.tiles { display: flex; flex-wrap: wrap; margin: 4px -5px 8px; }
.tile {
  width: calc(50% - 10px); margin: 5px; height: 56px; border: 0; border-radius: 7px;
  display: flex; align-items: center; padding: 5px; overflow: hidden;
  background: #1b1b22; color: inherit; font: inherit; text-align: left; cursor: pointer;
}
html.theme-light .tile { background: #e9e9ef; }
.tile-art {
  flex: 0 0 46px; width: 46px; height: 46px; border-radius: 4px;
  background-size: cover; background-position: center; position: relative; background-color: #2a2a33;
}
.tile-name {
  margin-left: 9px; font-size: 12px; font-weight: 600; line-height: 1.25;
  max-height: 30px; overflow: hidden; text-align: left;
}

.lrow, .arow {
  width: 100%; display: flex; align-items: center; background: transparent;
  border: 0; color: inherit; font: inherit; text-align: left; cursor: pointer;
  padding: 7px 2px; border-radius: 6px;
}
.lrow:active, .arow:active { background: rgba(127,127,127,.12); }
.lrow-art, .arow-art {
  flex: 0 0 54px; width: 54px; height: 54px; border-radius: 6px;
  background-size: cover; background-position: center; background-repeat: no-repeat;
  position: relative; background-color: #26262f;
  display: flex; align-items: center; justify-content: center;
}
.lrow-art.round, .arow-art.round { border-radius: 50%; }
.lrow-main { flex: 1 1 auto; min-width: 0; padding: 0 12px; display: block; }
.lrow-t {
  display: block; font-size: 14.5px; font-weight: 500;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.lrow-s { display: block; font-size: 11.5px; margin-top: 2px; }
.lrow > .ico, .arow > .ico { color: #6f6f7c; flex: 0 0 18px; }
.liked-art {
  background: linear-gradient(135deg, #4a2bd6 0%, #ab7df7 55%, #c9eed8 100%);
  color: #fff;
}
.liked-art .ico { width: 42%; height: 42%; }
.liked-art.big { flex: none; width: 132px; height: 132px; border-radius: 8px; }
.liked-art.big .ico { width: 54px; height: 54px; }
.add-art { background: #1b1b22; border: 1px dashed rgba(255,255,255,.22); color: #a7a7b3; }
html.theme-light .add-art { background: #ececf2; border-color: rgba(0,0,0,.18); color: #5e5e6b; }
.add-art .ico { width: 22px; height: 22px; }

.hint { font-size: 12px; line-height: 1.5; padding: 8px 2px 4px; }
.empty { padding: 38px 22px; text-align: center; }
.empty-ico {
  width: 56px; height: 56px; border-radius: 50%; margin: 0 auto 12px;
  background: #1c1c24; display: flex; align-items: center; justify-content: center; color: #9a9aa7;
}
html.theme-light .empty-ico { background: #e7e7ee; color: #5e5e6b; }
.empty-ico .ico { width: 26px; height: 26px; }
.empty-t { font-size: 16px; font-weight: 700; }
.empty-s { font-size: 12.5px; margin-top: 5px; line-height: 1.5; }

.onboard {
  margin: 24px 0; padding: 24px 20px 22px; text-align: center;
  background: #141419; border-radius: 14px;
}
html.theme-light .onboard { background: #fff; }
.onboard-art {
  width: 74px; height: 74px; border-radius: 50%; margin: 0 auto 14px;
  background: #1ed760; color: #06130a; display: flex; align-items: center; justify-content: center;
}
.onboard-art .ico { width: 34px; height: 34px; }
.onboard h2 { font-size: 20px; margin: 0 0 8px; }
.onboard p { font-size: 12.5px; line-height: 1.55; color: #a7a7b3; margin: 0 0 16px; }
html.theme-light .onboard p { color: #5e5e6b; }
.link {
  display: block; width: 100%; margin-top: 12px; border: 0; background: transparent;
  color: #1ed760; font: inherit; font-size: 12.5px; font-weight: 600;
  padding: 8px; cursor: pointer;
}

.btn {
  display: block; width: 100%; padding: 11px 16px; margin-top: 8px;
  border-radius: 8px; border: 1px solid rgba(255,255,255,.16);
  background: #1e1e26; color: inherit; font: inherit; font-size: 13px; font-weight: 600;
  cursor: pointer;
}
html.theme-light .btn { background: #fff; border-color: rgba(0,0,0,.14); }
.btn-primary { background: #1ed760; border-color: #1ed760; color: #06130a; }
.btn-ghost { background: transparent; }
.btn-danger { background: #b3261e; border-color: #b3261e; color: #fff; }
.btn.danger { color: #ff7b72; }
.btn.sm { display: inline-block; width: auto; padding: 8px 16px; margin: 0 8px 0 0; }
.btn.wide { width: 100%; margin-top: 12px; }

.round-btn {
  width: 40px; height: 40px; border-radius: 50%; border: 1px solid rgba(255,255,255,.18);
  background: transparent; color: inherit; display: inline-flex; align-items: center;
  justify-content: center; padding: 0; cursor: pointer;
}
html.theme-light .round-btn { border-color: rgba(0,0,0,.16); }
.round-btn.sm { width: 34px; height: 34px; }
.fab {
  width: 52px; height: 52px; border-radius: 50%; border: 0; background: #1ed760;
  color: #06130a; display: inline-flex; align-items: center; justify-content: center;
  padding: 0; margin-right: 12px; cursor: pointer;
}
.fab .ico { width: 24px; height: 24px; }
.spacer { flex: 1 1 auto; }
.actions { display: flex; align-items: center; margin: 12px 0 6px; }

/* --------------------------------------------------------------- tracks */

.tr {
  display: flex; align-items: center; min-height: 58px; padding: 4px 2px;
  border-radius: 6px; cursor: pointer;
}
.tr:active { background: rgba(127,127,127,.12); }
.tr.on .tr-title { color: #1ed760; }
.tr-idx { flex: 0 0 30px; width: 30px; text-align: center; color: #8b8b98; font-size: 12px; }
.tr-thumb {
  flex: 0 0 40px; width: 40px; height: 40px; border-radius: 4px;
  margin-right: 9px; background-size: cover; background-position: center;
  background-color: #26262f;
}
.tr-thumb .ph .ico { width: 18px; height: 18px; }
.tr-main { flex: 1 1 auto; min-width: 0; }
.tr-title {
  font-size: 14px; font-weight: 500;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.tr-sub {
  font-size: 11.5px; margin-top: 1px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.tr-dur { flex: 0 0 auto; font-size: 11.5px; color: #8b8b98; margin: 0 4px 0 8px; }
.tr-more {
  flex: 0 0 34px; width: 34px; height: 34px; border: 0; border-radius: 50%;
  background: transparent; color: #8b8b98; display: flex; align-items: center;
  justify-content: center; padding: 0; cursor: pointer;
}
.tr-more .ico { width: 18px; height: 18px; }

.eqbars { display: inline-flex; align-items: flex-end; height: 12px; }
.eqbars i {
  display: block; width: 2px; height: 4px; margin-right: 2px;
  background: #1ed760; border-radius: 1px;
}
.eqbars.on i { animation: eq 1s infinite ease-in-out; }
.eqbars.on i:nth-child(2) { animation-delay: .18s; }
.eqbars.on i:nth-child(3) { animation-delay: .36s; }
@keyframes eq {
  0%, 100% { height: 3px; }
  50% { height: 12px; }
}

.list-tools { display: flex; align-items: center; margin: 4px 0 6px; }
.play-pill {
  display: inline-flex; align-items: center; height: 34px; padding: 0 16px 0 12px;
  border-radius: 17px; border: 0; background: #1ed760; color: #06130a;
  font: inherit; font-size: 12.5px; font-weight: 700; cursor: pointer;
}
.play-pill .ico { width: 17px; height: 17px; margin-right: 6px; }
.list-tools .round-btn { margin-left: 8px; }
.list-tools .spacer { flex: 1 1 auto; }
select#sortsongs {
  height: 32px; max-width: 138px; padding: 0 6px; border-radius: 6px;
  border: 1px solid rgba(255,255,255,.16); background: #1b1b22; color: inherit;
  font: inherit; font-size: 11.5px;
}
html.theme-light select#sortsongs { background: #fff; border-color: rgba(0,0,0,.14); }
.list-meta { font-size: 11.5px; margin: 2px 0 4px; }

/* --------------------------------------------------------------- detail */

.detail { padding-top: 6px; }
.detail-head { display: flex; align-items: flex-end; margin: 6px 0 4px; }
.detail-art {
  flex: 0 0 132px; width: 132px; height: 132px; border-radius: 8px;
  background-size: cover; background-position: center; background-repeat: no-repeat;
  position: relative; background-color: #26262f; box-shadow: 0 8px 24px rgba(0,0,0,.35);
}
.detail-art.round { border-radius: 50%; }
.detail-info { flex: 1 1 auto; min-width: 0; padding-left: 14px; }
.kind {
  font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .12em;
  color: #a7a7b3;
}
.detail-info h1 { font-size: 21px; line-height: 1.15; margin: 3px 0 5px; letter-spacing: -.02em; }
.detail-sub { font-size: 12px; }
.detail-meta { font-size: 11.5px; margin-top: 2px; }
.detail-head.vertical { flex-direction: column; align-items: center; text-align: center; padding-top: 12px; }
.detail-head.vertical .detail-art { flex: none; width: 122px; height: 122px; }
.detail-head.vertical .detail-info { padding: 12px 0 0; }
.detail-head.vertical h1 { font-size: 24px; }

.genres { display: flex; flex-wrap: wrap; margin: 0 -5px; }
.genre {
  width: calc(50% - 10px); margin: 5px; height: 84px; border-radius: 8px;
  border: 0; position: relative; overflow: hidden; color: #fff; text-align: left;
  padding: 10px; font: inherit; cursor: pointer;
}
.genre-name { display: block; font-size: 14px; font-weight: 700; position: relative; z-index: 2; }
.genre-n { display: block; font-size: 10.5px; color: rgba(255,255,255,.72); margin-top: 2px; position: relative; z-index: 2; }
.genre-art {
  position: absolute; right: -8px; bottom: -8px; width: 56px; height: 56px;
  transform: rotate(22deg); border-radius: 4px; opacity: .85;
}
.genre.grad0 { background: linear-gradient(135deg, #3a1c71, #1b1035); }
.genre.grad1 { background: linear-gradient(135deg, #0e4a3d, #061c18); }
.genre.grad2 { background: linear-gradient(135deg, #5a2a0a, #1c0c02); }
.genre.grad3 { background: linear-gradient(135deg, #4a1030, #18040f); }
.genre.grad4 { background: linear-gradient(135deg, #1c3a6a, #07101f); }

/* --------------------------------------------------------------- search */

.searchbar {
  display: flex; align-items: center; height: 44px; padding: 0 12px;
  border-radius: 8px; background: #1b1b22; margin-bottom: 14px;
}
html.theme-light .searchbar { background: #e9e9ef; }
.searchbar .ico { flex: 0 0 20px; color: #a7a7b3; }
.searchbar input {
  flex: 1 1 auto; min-width: 0; height: 44px; border: 0; background: transparent;
  color: inherit; font: inherit; font-size: 14px; padding: 0 10px; outline: none;
}
.searchbar input::-ms-clear { display: none; }
.sbc {
  width: 28px; height: 28px; border: 0; border-radius: 50%; background: transparent;
  color: #a7a7b3; display: flex; align-items: center; justify-content: center;
  padding: 0; cursor: pointer;
}
.sbc .ico { width: 16px; height: 16px; }

.chips { display: flex; flex-wrap: wrap; margin: 4px 0 8px; }
.chip {
  flex: none; margin: 0 8px 8px 0; padding: 7px 14px; border-radius: 16px;
  border: 1px solid rgba(255,255,255,.2); background: transparent; color: inherit;
  font: inherit; font-size: 12px; font-weight: 500; cursor: pointer; white-space: nowrap;
}
html.theme-light .chip { border-color: rgba(0,0,0,.18); }
.chip.on { background: #1ed760; border-color: #1ed760; color: #06130a; font-weight: 700; }
.chips.filter { margin-top: 0; }
.chips.scroll { flex-wrap: nowrap; overflow-x: auto; -webkit-overflow-scrolling: touch; padding-bottom: 2px; }

/* ---------------------------------------------------------------- music */

.artists { padding-top: 2px; }
.arow-art { border-radius: 50%; }
.arow { padding: 8px 2px; }

/* -------------------------------------------------------------- settings */

.set-card {
  background: #141419; border-radius: 12px; margin-bottom: 12px;
  padding: 4px 0 6px; overflow: hidden;
}
html.theme-light .set-card { background: #fff; }
.set-title {
  font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .1em;
  color: #a7a7b3; padding: 12px 14px 4px;
}
html.theme-light .set-title { color: #5e5e6b; }
.set-row { display: flex; align-items: center; padding: 10px 14px; }
.set-row.flat { width: 100%; }
.set-text { flex: 1 1 auto; min-width: 0; }
.set-label { font-size: 13.5px; font-weight: 600; }
.set-sub { font-size: 11.5px; margin-top: 2px; line-height: 1.4; }
.link-card {
  display: block; width: 100%; border: 0; text-align: left; color: inherit;
  font: inherit; background: #141419; padding: 0; cursor: pointer;
}
html.theme-light .link-card { background: #fff; }
.chev { color: #8b8b98; margin-left: 10px; }
.switch {
  flex: 0 0 44px; width: 44px; height: 26px; border-radius: 13px; border: 0;
  background: #3a3a45; position: relative; cursor: pointer; padding: 0;
}
.switch span {
  position: absolute; left: 3px; top: 3px; width: 20px; height: 20px;
  border-radius: 50%; background: #fff; transition: left .15s ease;
}
.switch.on { background: #1ed760; }
.switch.on span { left: 21px; }

.slider-wrap { display: flex; align-items: center; flex: 0 0 132px; width: 132px; }
.slider-wrap input { flex: 1 1 auto; min-width: 0; }
.slider-val { flex: 0 0 30px; width: 30px; text-align: right; font-size: 11px; }

.stats { display: flex; flex-wrap: wrap; padding: 2px 14px 6px; }
.stats span { width: 50%; font-size: 11.5px; padding: 3px 0; }
.stats b { display: block; font-size: 16px; color: inherit; font-weight: 700; margin-bottom: 1px; }
.about { padding: 4px 14px 8px; font-size: 12px; line-height: 1.55; }
.about b { color: inherit; font-weight: 600; }
.about p { margin: 10px 0 0; color: #a7a7b3; }
html.theme-light .about p { color: #5e5e6b; }
.set-card .btn { width: calc(100% - 28px); margin: 8px 14px 0; }

.seg {
  display: flex; background: #1b1b22; border-radius: 8px; padding: 3px;
  margin: 2px 0 14px;
}
html.theme-light .seg { background: #e9e9ef; }
.seg.small { margin: 0 14px 12px; }
.seg-btn {
  flex: 1 1 0; min-width: 0; border: 0; border-radius: 6px; background: transparent;
  color: #a7a7b3; font: inherit; font-size: 12px; font-weight: 600;
  padding: 8px 4px; cursor: pointer; white-space: nowrap; overflow: hidden;
  text-overflow: ellipsis;
}
html.theme-light .seg-btn { color: #5e5e6b; }
