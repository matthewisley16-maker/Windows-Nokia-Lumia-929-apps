<!DOCTYPE html>
<html class="theme-dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<meta name="format-detection" content="telephone=no" />
<meta name="msapplication-tap-highlight" content="no" />
<meta name="msapplication-navbutton-color" content="#0a0a0d" />
<title>MP3Lumia</title>
<link rel="stylesheet" href="app.css" id="appcss" />
</head>
<body>

<div id="boot"><div class="boot-mark"><svg class="ico ico-fill" viewBox="0 0 24 24"><path d="M9 18.2V5.5l10-2v12.2"/><circle cx="6.6" cy="19" r="2.6"/><circle cx="16.6" cy="17.5" r="2.6"/></svg></div><div class="boot-name">MP3LUMIA</div></div>
<div id="jsfail">MP3Lumia could not start on this device. JavaScript must be enabled.</div>

<header class="topbar">
  <button class="iconbtn back" id="back" data-act="back" aria-label="Back">
    <svg class="ico" viewBox="0 0 24 24"><path d="M15 4l-8 8 8 8"/></svg>
  </button>
  <div class="brand">
    <span class="brand-mark"><svg class="ico ico-fill" viewBox="0 0 24 24"><path d="M9 18.2V5.5l10-2v12.2"/><circle cx="6.6" cy="19" r="2.6"/><circle cx="16.6" cy="17.5" r="2.6"/></svg></span>
    <span class="brand-name">MP3<b>LUMIA</b></span>
  </div>
  <div class="topbar-actions">
    <button class="iconbtn" data-act="tab" data-tab="search" aria-label="Search">
      <svg class="ico" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.4 15.4L21 21"/></svg>
    </button>
    <button class="iconbtn" data-act="theme-cycle" aria-label="Change theme">
      <svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 3.5v17"/><path d="M12 3.5a8.5 8.5 0 0 1 0 17z" fill="currentColor" stroke="none"/></svg>
    </button>
    <button class="iconbtn" data-act="tab" data-tab="settings" aria-label="Settings">
      <svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2.8v3M12 18.2v3M2.8 12h3M18.2 12h3M5.5 5.5l2.1 2.1M16.4 16.4l2.1 2.1M18.5 5.5l-2.1 2.1M7.6 16.4l-2.1 2.1"/></svg>
    </button>
  </div>
</header>

<main id="main" class="main"></main>

<div id="mini" class="mini"></div>

<nav class="tabbar">
  <button class="tab on" data-act="tab" data-tab="home" data-tabbtn="home">
    <svg class="ico" viewBox="0 0 24 24"><path d="M3 10.6L12 3l9 7.6V21h-6v-6H9v6H3z"/></svg>
    <span>Home</span>
  </button>
  <button class="tab" data-act="tab" data-tab="search" data-tabbtn="search">
    <svg class="ico" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.4 15.4L21 21"/></svg>
    <span>Search</span>
  </button>
  <button class="tab" data-act="tab" data-tab="library" data-tabbtn="library">
    <svg class="ico" viewBox="0 0 24 24"><path d="M4 4v16M9 4v16"/><path d="M14.5 4.8l4.6 15.1"/></svg>
    <span>Library</span>
  </button>
  <button class="tab" data-act="tab" data-tab="settings" data-tabbtn="settings">
    <svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2.8v3M12 18.2v3M2.8 12h3M18.2 12h3M5.5 5.5l2.1 2.1M16.4 16.4l2.1 2.1M18.5 5.5l-2.1 2.1M7.6 16.4l-2.1 2.1"/></svg>
    <span>Settings</span>
  </button>
</nav>

<div id="np" class="np"></div>
<div id="sheet" class="sheet" data-act="sheet-close"></div>
<div id="toast" class="toast"></div>

<audio id="deckA" preload="auto"></audio>
<audio id="deckB" preload="auto"></audio>

<input type="file" id="fileinput" multiple
       accept="audio/*,.mp3,.mp2,.m4a,.m4b,.aac,.flac,.wav,.ogg,.oga,.opus,.wma,.aif,.aiff,.alac,.amr" />
<input type="file" id="dirinput" multiple webkitdirectory />

<script src="boot.js"></script>
<script src="app.js"></script>
</body>
</html>
